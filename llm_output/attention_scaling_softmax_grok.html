<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why divide by √head_size</title>
<style>
  :root{
    --raw:#e0533d; --scaled:#18a558; --ink:#1f2733; --muted:#6b7684;
    --line:#dfe4ea; --bg:#f7f9fc;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:15px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;
        box-shadow:0 1px 3px rgba(20,30,50,.05);padding:20px 24px;margin-bottom:20px}
  .ctrl{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .ctrl label{font-size:15px;font-weight:600}
  input[type=range]{flex:1;min-width:240px}
  .val{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:16px;
       background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
  button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;
         border-radius:9px;padding:7px 14px;cursor:pointer}
  button:hover{background:var(--bg)}
  .meta{font-size:13.5px;color:var(--muted);margin-top:6px}
  .panels{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
  .panel{flex:1;min-width:320px}
  .ptitle{font-size:15px;font-weight:600;margin:0 0 2px}
  .ptitle .tag{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;
               font-weight:500;color:var(--muted)}
  .pk{font-size:13px;color:var(--muted);margin:2px 0 10px}
  .note{font-size:13.5px;background:#eef4ff;border:1px solid #cfe0ff;border-radius:10px;
        padding:12px 14px;margin-top:4px;color:#274690}
  code{font-family:"SF Mono",ui-monospace,Menlo,monospace;background:#eef1f5;border-radius:4px;padding:1px 5px}
  b.raw{color:var(--raw)} b.scaled{color:var(--scaled)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Same attention, one slider: <span style="color:var(--muted)">watch softmax snap to one&#8209;hot as <code>head_size</code> grows</code></span></h1>
  <p class="sub">One token's query dotted against 6 keys. Left = raw scores into softmax. Right = scores &divide; &radic;head_size. Drag <code>head_size</code> and watch what happens on the left.</p>

  <div class="card">
    <div class="ctrl">
      <label>head_size</label>
      <input type="range" id="d" min="1" max="128" value="5">
      <span class="val" id="dVal">5</span>
      <button id="shuffle">reshuffle weights</button>
    </div>
    <div class="meta" id="meta"></div>

    <div class="panels">
      <div class="panel">
        <p class="ptitle"><b class="raw">RAW</b> &nbsp;<span class="tag">softmax(q&middot;k)</span></p>
        <p class="pk" id="pkRaw"></p>
        <svg id="svgRaw" width="100%" height="210" viewBox="0 0 380 210"></svg>
      </div>
      <div class="panel">
        <p class="ptitle"><b class="scaled">SCALED</b> &nbsp;<span class="tag">softmax(q&middot;k / &radic;head_size)</span></p>
        <p class="pk" id="pkScaled"></p>
        <svg id="svgScaled" width="100%" height="210" viewBox="0 0 380 210"></svg>
      </div>
    </div>

    <div class="note" id="note"></div>
  </div>
</div>

<script>
const SVGNS="http://www.w3.org/2000/svg";
const nKeys = 6;
let seed = 20260919;

// seeded RNG (mulberry32) + Box-Muller normal
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function normal(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function softmax(xs){const m=Math.max(...xs);const e=xs.map(x=>Math.exp(x-m));
  const s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s);}
function entropy(ps){return -ps.reduce((a,p)=>a+(p>1e-12?p*Math.log2(p):0),0);}

function el(name,attrs){const e=document.createElementNS(SVGNS,name);
  for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

function drawBars(svg,probs,color){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  const W=380,H=210,padL=8,padB=26,padT=10;
  const bw=(W-padL*2)/nKeys, gap=10, plot=H-padB-padT;
  // baseline
  svg.appendChild(el('line',{x1:0,y1:H-padB,x2:W,y2:H-padB,stroke:'#c8cfd8','stroke-width':1}));
  probs.forEach((p,i)=>{
    const x=padL+i*bw+gap/2, w=bw-gap, h=Math.max(1,p*plot), y=H-padB-h;
    svg.appendChild(el('rect',{x,y,width:w,height:h,rx:4,fill:color,'fill-opacity':0.85}));
    const t=el('text',{x:x+w/2,y:y-5,'text-anchor':'middle','font-size':12,
       'font-family':'ui-monospace,Menlo,monospace',fill:'#1f2733'});
    t.textContent=(p*100).toFixed(p>=0.1?0:1)+'%';
    svg.appendChild(t);
    const lbl=el('text',{x:x+w/2,y:H-padB+16,'text-anchor':'middle','font-size':11,fill:'#8a929c'});
    lbl.textContent='k'+i;
    svg.appendChild(lbl);
  });
}

function render(){
  const d=+document.getElementById('d').value;
  document.getElementById('dVal').textContent=d;

  const r=mulberry(seed);
  const q=Array.from({length:d},()=>normal(r));
  const scores=[];
  for(let j=0;j<nKeys;j++){
    const k=Array.from({length:d},()=>normal(r));
    let dot=0;for(let i=0;i<d;i++)dot+=q[i]*k[i];
    scores.push(dot);
  }
  const scaled=scores.map(s=>s/Math.sqrt(d));

  const pRaw=softmax(scores), pScaled=softmax(scaled);
  drawBars(document.getElementById('svgRaw'),pRaw,getCSS('--raw'));
  drawBars(document.getElementById('svgScaled'),pScaled,getCSS('--scaled'));

  const lo=Math.min(...scores).toFixed(1), hi=Math.max(...scores).toFixed(1);
  document.getElementById('meta').innerHTML=
    `raw scores span <code>${lo} … ${hi}</code> &nbsp;|&nbsp; &radic;head_size = <code>${Math.sqrt(d).toFixed(2)}</code>, so we're dividing by that.`;

  const maxR=(Math.max(...pRaw)*100).toFixed(0), maxS=(Math.max(...pScaled)*100).toFixed(0);
  document.getElementById('pkRaw').innerHTML=`biggest weight: <b class="raw">${maxR}%</b> &nbsp; (entropy ${entropy(pRaw).toFixed(2)} bits)`;
  document.getElementById('pkScaled').innerHTML=`biggest weight: <b class="scaled">${maxS}%</b> &nbsp; (entropy ${entropy(pScaled).toFixed(2)} bits)`;

  document.getElementById('note').innerHTML = d>=48
    ? `At <b>head_size ${d}</b> the raw side has collapsed to a near one&#8209;hot &mdash; one key gets ~${maxR}%, the rest starve. The scaled side stays soft (~${maxS}% max). This is why real models (head_size 64+) <b>must</b> divide by &radic;head_size, or attention would start frozen.`
    : `Notice the raw scores' span grows roughly like &radic;head_size as you drag right &mdash; that's what sharpens the left chart. Dividing by &radic;head_size cancels exactly that growth, so the right chart barely moves. Push the slider past ~50 to see the raw side snap to one&#8209;hot.`;
}
function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

document.getElementById('d').addEventListener('input',render);
document.getElementById('shuffle').addEventListener('click',()=>{seed=(seed*1664525+1013904223)>>>0;render();});
render();
</script>
</body>
</html>
